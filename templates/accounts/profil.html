{% extends "base.html" %}
{% block title %}Mon profil{% endblock %}
{% block page_titre %}Mon profil{% endblock %}

{% block content %}
<h1 class="text-2xl font-semibold text-slate-800 mb-6">Mon profil</h1>

<div class="bg-white rounded-xl border border-slate-200 p-6 max-w-lg">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% include "includes/form_champs.html" %}
        <button type="submit" class="mt-2 px-4 py-2 rounded-lg bg-primary-600 text-white text-sm font-medium hover:bg-primary-700">
            Enregistrer
        </button>
    </form>
    <a href="{% url 'accounts:changer_mot_de_passe' %}" class="inline-block mt-4 text-sm text-primary-600 hover:underline">
        Changer mon mot de passe →
    </a>
</div>
{% endblock %}

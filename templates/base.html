{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NOVA RH{% endblock %}</title>

    <!-- Tailwind CSS v3, compile localement via Tailwind CLI (voir package.json / tailwind.config.js).
         Le fichier ci-dessous est genere par `npm run build:css` ou `npm run watch:css`. -->
    <link rel="stylesheet" href="{% static 'css/output.css' %}">

    <!-- Icones : Boxicons + Font Awesome, charges via CDN -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

{% if user.is_authenticated %}
<div class="min-h-screen flex">
    {% include "includes/sidebar.html" %}

    <div class="flex-1 flex flex-col min-w-0">
        {% include "includes/navbar.html" %}

        <main class="flex-1 p-6">
            {% include "includes/messages.html" %}
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
{% else %}
    {% block contenu_public %}{% endblock %}
{% endif %}

</body>
</html>
